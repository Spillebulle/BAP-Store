#
# A pacman.conf the shape CachyOS writes. The test replaces @DIR@ with the
# fixture directory so the Include lines resolve.
#
[options]
HoldPkg     = pacman glibc
#DBPath      = /var/lib/pacman/
Architecture = x86_64 x86_64_v3
IgnorePkg   = linux-cachyos
Color
ParallelDownloads = 10

#<disabled_v4>[cachyos-v4]
#<disabled_v4>Include = @DIR@/cachyos-v4-mirrorlist

[cachyos-v3]
Include = @DIR@/cachyos-v3-mirrorlist

#[core-testing]
#Include = @DIR@/mirrorlist

[core]
Include = @DIR@/mirrorlist

[extra]
Include = @DIR@/mirrorlist

[multilib]
Include = @DIR@/mirrorlist

# Enabled but never synced: no .db file exists for it.
[never-synced]
Server = https://example.invalid/$repo/os/$arch
